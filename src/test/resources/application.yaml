spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: localhost
    port: 25
    username: test@example.com
    password: test-password

  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 5MB

server:
  port: 0

management:
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://frontend-repo-coral.vercel.app}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  s3:
    region: ap-northeast-2
    bucket: aipm-test-bucket
  auth:
    access-token-expiration-minutes: 30
    absolute-login-expiration-hours: 8
    jwt-secret: test-secret-test-secret-test-secret-test-secret
  mail:
    enabled: true
    from-address: test-sender@example.com
    max-attempts: 3
    retry-delay-ms: 1
  document:
    storage-path: build/test-uploads/documents
    max-file-size: 1048576
    allowed-extensions:
      - pdf
      - docx
      - xlsx
      - pptx
      - txt
    allowed-mime-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/vnd.openxmlformats-officedocument.presentationml.presentation
      - text/plain

agent:
  planning:
    base-url: http://localhost:8000
    extract-path: /api/v1/planning/documents/extract
    connect-timeout: 1s
    read-timeout: 2s

ai-server:
  base-url: http://localhost:8000
  document-extract-path: /api/v1/planning/documents/extract
  connect-timeout-seconds: 1
  response-timeout-seconds: 2
