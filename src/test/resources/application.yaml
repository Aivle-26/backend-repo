spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop

  mail:
    host: localhost
    port: 25
    username: test@example.com
    password: test-password

server:
  port: 0

app:
  mail:
    from-address: test-sender@example.com
  document:
    storage-path: build/test-uploads/documents
    max-file-size: 1048576
    allowed-extensions:
      - pdf
      - doc
      - docx
      - txt
    allowed-mime-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
