# 로컬 개발 프로필. 실행: --spring.profiles.active=local
#
# MySQL 설치나 Docker 없이 바로 뜬다. H2 인메모리 DB를 쓰므로
# 앱을 끄면 데이터가 사라진다. Slack 연동 확인 용도로는 충분하다.
#
# 데이터를 유지해야 하면 MySQL로 전환하고 DB_URL/DB_USERNAME/DB_PASSWORD를 넣으면 된다.

spring:
  datasource:
    # MODE=MySQL: H2를 MySQL 문법 호환 모드로 동작시킨다.
    # DB_CLOSE_DELAY=-1: 커넥션이 잠깐 끊겨도 DB 내용이 유지된다(앱 종료 시엔 소멸).
    url: jdbc:h2:mem:aipm;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 로컬에서 실제 메일 발송이 필요할 때만 MAIL_ENABLED=true와 Gmail 앱 비밀번호를 설정한다.
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_REQUIRED:true}

  jpa:
    hibernate:
      # 인메모리라 매번 새로 만든다. 엔티티 매핑이 잘못되면 여기서 바로 터진다.
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      # 브라우저에서 DB를 직접 들여다볼 수 있다: http://localhost:8080/h2-console
      # JDBC URL 칸에 위 datasource.url 을 그대로 붙여넣고 접속.
      enabled: true
      path: /h2-console

logging:
  level:
    com.aivle26.aipm: DEBUG

app:
  auth:
    # 로컬 전용 더미 JWT secret. 운영은 EC2의 AUTH_JWT_SECRET 환경변수를 쓴다.
    # 팀원 권한 작업(910aa3e)이 secret에 "최소 32자" 검증을 걸어서,
    # 로컬에 값이 없으면 부팅이 실패한다. 이 값은 로컬 전용이라 시크릿이 아니다.
    jwt-secret: ${AUTH_JWT_SECRET:local-dev-only-jwt-secret-please-change-in-prod-0123456789}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:BidWorks AI}
    reply-to: ${MAIL_REPLY_TO:}
    subject-prefix: ${MAIL_SUBJECT_PREFIX:[BidWorks AI]}
  slack:
    # IntelliJ 실행 설정의 환경변수에 SLACK_BOT_TOKEN 을 넣으면 여기로 들어온다.
    bot-token: ${SLACK_BOT_TOKEN:}
  ai:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
