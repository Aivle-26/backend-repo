spring:
  application:
    name: aipm

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aipm}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}