spring:
  application:
    name: aipm

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/aipm}
    username: ${DB_USERNAME:aipm_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  auth:
    access-token-expiration-minutes: ${AUTH_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
    absolute-login-expiration-hours: ${AUTH_ABSOLUTE_LOGIN_EXPIRATION_HOURS:8}
    inactivity-timeout-minutes: ${AUTH_INACTIVITY_TIMEOUT_MINUTES:30}
    jwt-secret: ${AUTH_JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:}
    from-name: ${MAIL_FROM_NAME:AIPM}
  document:
    storage-path: ${DOCUMENT_STORAGE_PATH:uploads/documents}
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:10485760}
    allowed-extensions:
      - pdf
      - doc
      - docx
      - xls
      - xlsx
      - hwp
      - hwpx
      - txt
    allowed-mime-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - application/x-hwp
      - application/haansofthwp
      - application/octet-stream
      - text/plain
