
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>BidWorks AI 프로토타입 제작</title>
      <meta name="description" content="AI-powered platform streamlines public RFP project management by enabling PMs to assign tasks and employees to track and submit deliverables efficiently." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // 초기 테마 적용 (화면 깜빡임 방지)
        (function () {
          try {
            var t = localStorage.getItem("bidworks-theme");
            if (t !== "light" && t !== "dark") {
              t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            if (t === "dark") document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = t;
          } catch (e) {}
        })();
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
