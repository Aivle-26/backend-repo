# 로컬 개발용 MySQL.
#
# 운영용 compose.yml은 /etc/aipm/mysql.env 를 참조해 EC2에서만 동작한다.
# 이 파일은 로컬에서 바로 뜨도록 값을 인라인으로 둔다.
# 여기 적힌 비밀번호는 로컬 전용이며 운영에서 재사용하지 말 것.
#
#   docker compose -f deploy/mysql/compose.local.yml up -d
#   docker compose -f deploy/mysql/compose.local.yml ps      # healthy 확인 후 앱 실행
#   docker compose -f deploy/mysql/compose.local.yml down -v  # 데이터까지 삭제

services:
  mysql:
    image: mysql:8.0
    container_name: aipm-mysql-local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: aipm
      MYSQL_USER: aipm_user
      MYSQL_PASSWORD: localpw
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - aipm-mysql-local-data:/var/lib/mysql
    healthcheck:
      # 컨테이너가 떠도 MySQL이 접속을 받기까지 10~20초 걸린다.
      # 이 헬스체크가 없으면 "떴는데 왜 Access denied냐"로 헤매게 된다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-plocalroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aipm-mysql-local-data:
